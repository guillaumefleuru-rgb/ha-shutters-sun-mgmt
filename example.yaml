# Exemple de configuration pour le Blueprint "Gestion Solaire Volets"
# Ce fichier montre comment configurer une automatisation utilisant ce blueprint.
# À placer dans votre dossier `automations/` de Home Assistant.

# -- Exemple 1: Configuration complète avec 5 fenêtres --
alias: Gestion Solaire Volets (Déclenchement par Angle Solaire)
description: >
  Automatisation principale utilisant le blueprint pour gérer toutes les fenêtres de la maison.
  Les fenêtres Est (90°) ont une élévation minimale plus élevée (30°) pour éviter
  l'ensoleillement direct le matin.
use_blueprint:
  path: volets_solaires_paliers.yaml
  input:
    # --- Paramètres Généraux ---
    nb_paliers: 5              # 5 paliers intermédiaires entre Pmin et 100%
    min_position_active: 20   # Ignore les volets sous 20% (compatible Somfy My)
    presence_sensor: person.guillaume_fleuru  # Désactive tout si absent

    # --- Fenêtre 1: Chambre Marie (Sud) ---
    f1_active: input_boolean.fenetre_marie
    f1_cover: cover.chambre_marie_low_speed
    f1_emin: 20               # Élévation minimale par défaut
    f1_lf: 1.0               # Largeur de la baie (1m)
    f1_pf: 0.25              # Profondeur du tableau (25cm)
    f1_of: 180               # Orientation Sud
    f1_dmax: 1.15            # Hauteur de course exploitable
    f1_pmin: 25              # Position au bas de vitre (25%)
    f1_exit: 100             # Position de fin d'ensoleillement
    f1_morning: false        # Ne pas gérer le matin

    # --- Fenêtre 2: Chambre Louise (Sud) ---
    f2_active: input_boolean.fenetre_louise
    f2_cover: cover.chambre_louise_low_speed
    f2_emin: 20
    f2_lf: 1.0
    f2_pf: 0.25
    f2_of: 180
    f2_dmax: 1.15
    f2_pmin: 25
    f2_exit: 100
    f2_morning: false

    # --- Fenêtre 3: Chambre Come (Est) ---
    f3_active: input_boolean.fenetre_come
    f3_cover: cover.chambre_come_low_speed
    f3_emin: 30               # Élévation minimale plus élevée pour l'Est
    f3_lf: 1.0
    f3_pf: 0.25
    f3_of: 90                # Orientation Est
    f3_dmax: 1.15
    f3_pmin: 25
    f3_exit: 100
    f3_morning: false

    # --- Fenêtre 4: Chambre Parents (Est) ---
    f4_active: input_boolean.fenetre_parents
    f4_cover: cover.chambre_parents_volet_parents_low_speed
    f4_emin: 30               # Élévation minimale plus élevée pour l'Est
    f4_lf: 1.0
    f4_pf: 0.25
    f4_of: 90                # Orientation Est
    f4_dmax: 1.15
    f4_pmin: 25
    f4_exit: 100
    f4_morning: false

    # --- Fenêtre 5: Salle à Manger (Ouest) ---
    f5_active: input_boolean.fenetre_salle_a_manger
    f5_cover: cover.salle_a_manger_low_speed
    f5_emin: 20
    f5_lf: 1.0
    f5_pf: 0.25
    f5_of: 270               # Orientation Ouest
    f5_dmax: 1.15
    f5_pmin: 25
    f5_exit: 100
    f5_morning: true         # Gère le matin pour cette fenêtre

