trigger:
  - platform: state
    entity_id: sun.sun
    attribute: azimuth
  - platform: state
    entity_id: sun.sun
    attribute: elevation

condition:
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 0

action:
  - variables:
      pi: 3.14159265359
      A: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
      E: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
      N: !input nb_paliers
      min_pos: !input min_position_active
      presence_sensor: !input presence_sensor

      is_present: >-
        {% if presence_sensor != [] and presence_sensor != None %}
          {% set state = states(presence_sensor) %}
          {{ state in ['on', 'home', 'connected'] }}
        {% else %}
          true
        {% endif %}

      windows:
        - active_entity: !input f1_active
          entity: !input f1_cover
          Emin: !input f1_emin
          Lf: !input f1_lf
          Pf: !input f1_pf
          Of: !input f1_of
          Dmax: !input f1_dmax
          Pmin: !input f1_pmin
          ExitPos: !input f1_exit
          MorningMode: !input f1_morning
        - active_entity: !input f2_active
          entity: !input f2_cover
          Emin: !input f2_emin
          Lf: !input f2_lf
          Pf: !input f2_pf
          Of: !input f2_of
          Dmax: !input f2_dmax
          Pmin: !input f2_pmin
          ExitPos: !input f2_exit
          MorningMode: !input f2_morning
        - active_entity: !input f3_active
          entity: !input f3_cover
          Emin: !input f3_emin
          Lf: !input f3_lf
          Pf: !input f3_pf
          Of: !input f3_of
          Dmax: !input f3_dmax
          Pmin: !input f3_pmin
          ExitPos: !input f3_exit
          MorningMode: !input f3_morning
        - active_entity: !input f4_active
          entity: !input f4_cover
          Emin: !input f4_emin
          Lf: !input f4_lf
          Pf: !input f4_pf
          Of: !input f4_of
          Dmax: !input f4_dmax
          Pmin: !input f4_pmin
          ExitPos: !input f4_exit
          MorningMode: !input f4_morning
        - active_entity: !input f5_active
          entity: !input f5_cover
          Emin: !input f5_emin
          Lf: !input f5_lf
          Pf: !input f5_pf
          Of: !input f5_of
          Dmax: !input f5_dmax
          Pmin: !input f5_pmin
          ExitPos: !input f5_exit
          MorningMode: !input f5_morning

  - repeat:
      for_each: "{{ windows }}"
      sequence:
        - variables:
            win: "{{ repeat.item }}"

            dash_active: >-
              {% if win.active_entity != [] and win.active_entity != None %}
                {{ is_state(win.active_entity, 'on') }}
              {% else %}
                true
              {% endif %}

            current_pos: "{{ state_attr(win.entity, 'current_position') | default(-1, true) | int }}"
            pos_active: "{{ current_pos >= min_pos }}"

            is_active: "{{ is_present and dash_active and pos_active }}"

            target_pc: >-
              {% if is_active and win.entity != [] and win.entity != None %}
                {% set Champ = 90 - (atan(win.Pf / win.Lf) * 180 / pi) %}
                {% set Az_Min = win.Of - Champ %}
                {% set Az_Max = win.Of + Champ %}

                {% if A >= Az_Min and A <= Az_Max and E >= win.Emin %}
                  {# --- 1. LE SOLEIL TAPE SUR LA FENÊTRE (Phase Active) --- #}
                  {% set delta_A_rad = (A - win.Of) * pi / 180 %}
                  {% set E_rad = E * pi / 180 %}
                  {% set cos_delta = cos(delta_A_rad) %}
                  {% if cos_delta == 0 or cos_delta | abs < 0.01 %}
                    {{ win.ExitPos }}
                  {% else %}
                    {% set tan_Ef = tan(E_rad) / cos_delta %}
                    {% set D = win.Pf * tan_Ef %}
                    {% set D_clamped = [[D, 0] | max, win.Dmax] | min %}

                    {% set Ratio_Ouverture = D_clamped / win.Dmax %}
                    {% set Index_theorique = Ratio_Ouverture * N %}

                    {% set Index_palier = Index_theorique | round(0, 'floor') | int %}
                    {% set Index_clamped = [[Index_palier, 0] | max, N] | min %}

                    {% set Pas = (100 - win.Pmin) / N %}
                    {{ (win.Pmin + (Index_clamped * Pas)) | round | int }}
                  {% endif %}

                {% elif (A > Az_Max and not (Az_Min > Az_Max)) or (A < Az_Min and Az_Min > Az_Max) or E < win.Emin %}
                  {# --- 2. LE SOLEIL EST PASSÉ OU SE COUCHE (Fin de cycle) --- #}
                  {{ win.ExitPos }}

                {% else %}
                  {# --- 3. LE MATIN : LE SOLEIL N'EST PAS ENCORE LÀ --- #}
                  {% if win.MorningMode %}
                    {{ win.ExitPos }}
                  {% else %}
                    -1
                  {% endif %}
                {% endif %}
              {% else %}
                -1
              {% endif %}

        - if:
            - condition: template
              value_template: "{{ target_pc | int != -1 }}"
            - condition: template
              value_template: >-
                {{ state_attr(win.entity, 'current_position') | int(0) != target_pc | int }}
          then:
            - service: cover.set_cover_position
              target:
                entity_id: "{{ win.entity }}"
              data:
                position: "{{ target_pc | int }}"