blueprint:
  name: "Gestion Solaire Volets (Déclenchement par Angle Solaire)"
  description: >
    Gère jusqu'à 5 fenêtres avec géométrie pure, découpage par paliers, protection sieste (compatible Somfy My), gestion de présence, position de fin de cycle et gestion matinale personnalisables.
  domain: automation
  input:
    # --- PARAMÈTRES GÉNÉRAUX ---
    section_general:
      name: "Paramètres Généraux"
      icon: mdi:cog
      collapsed: false
      input:
        nb_paliers:
          name: "Nombre de paliers intermédiaires"
          description: "Nombre de crans de réglage entre le bas de vitre et l'ouverture totale. Ex: 5"
          default: 5
          selector:
            number:
              min: 2
              max: 10
        min_position_active:
          name: "Seuil d'ouverture minimal (Protection Sieste) en %"
          description: "Si le volet est sous ce seuil (ex: nuit, sieste, position 'My' Somfy), l'automatisation l'ignore. Un seuil de 20% est idéal pour exclure la position 'My' (15%)."
          default: 20
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        presence_sensor:
          name: "Capteur de présence global (Optionnel)"
          description: "Entrée binaire (binary_sensor), personne (person), ou tracker (device_tracker). Si absent, la gestion solaire est suspendue."
          default: []
          selector:
            entity:
              domain:
                - binary_sensor
                - person
                - device_tracker

    # --- FENÊTRE 1 ---
    section_f1:
      name: "Fenêtre 1 (Obligatoire)"
      icon: mdi:window-closed
      collapsed: false
      input:
        f1_active:
          name: "Interrupteur d'activation Dashboard (Optionnel)"
          description: "Entrée booléenne (input_boolean) pour contrôler cette fenêtre depuis le Dashboard."
          default: []
          selector:
            entity:
              domain: input_boolean
        f1_cover:
          name: "Volet"
          selector:
            entity:
              domain: cover
        f1_emin:
          name: "Élévation minimale du soleil"
          description: "Angle minimal du soleil au-dessus de l'horizon pour que l'ensoleillement soit actif (en °)."
          default: 20
          selector:
            number:
              min: 0
              max: 45
              unit_of_measurement: "°"
        f1_lf:
          name: "Largeur de la baie"
          default: 1.0
          selector:
            number: { min: 0.2, max: 5.0, step: 0.05, unit_of_measurement: "m" }
        f1_pf:
          name: "Profondeur du tableau"
          description: "Distance entre la vitre et le volet (m). Si balcon au-dessus, ajoutez sa profondeur."
          default: 0.25
          selector:
            number: { min: 0.05, max: 1.0, step: 0.01, unit_of_measurement: "m" }
        f1_of:
          name: "Orientation de la fenêtre"
          description: "0=Nord, 90=Est, 180=Sud, 270=Ouest"
          default: 180
          selector:
            number: { min: 0, max: 360, unit_of_measurement: "°" }
        f1_dmax:
          name: "Hauteur de course exploitable du volet"
          default: 1.15
          selector:
            number: { min: 0.2, max: 4.0, step: 0.05, unit_of_measurement: "m" }
        f1_pmin:
          name: "Position du volet au niveau du bas de vitre (%)"
          default: 25
          selector:
            number: { min: 0, max: 100, unit_of_measurement: "%" }
        f1_exit:
          name: "Position de fin d'ensoleillement (%)"
          description: "Position adoptée lorsque le soleil quitte la fenêtre (azimut hors champ ou élévation trop basse)."
          default: 100
          selector:
            number: { min: 0, max: 100, unit_of_measurement: "%" }
        f1_morning:
          name: "Gestion du matin (avant ensoleillement)"
          description: "Désactivé : ignore le volet tant que le soleil n'y tape pas. Activé : applique la 'Position de fin d'ensoleillement' dès le matin."
          default: false
          selector:
            boolean: {}

    # --- FENÊTRE 2 ---
    section_f2:
      name: "Fenêtre 2 (Optionnelle)"
      icon: mdi:window-closed
      collapsed: true
      input:
        f2_active:
          name: "Interrupteur d'activation (Optionnel)"
          default: []
          selector: { entity: { domain: input_boolean } }
        f2_cover:
